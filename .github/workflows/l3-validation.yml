name: Validate L3 - Kconfig Structure

# Fires whenever a student pushes the tag the assignment asks for (l3-task1).
# Adjust the pattern below if you end up reusing this for l3-task2, etc.
on:
  push:
    tags:
      - 'l3-task*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission at the pushed tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kconfiglib
        run: pip install kconfiglib

      - name: Run Kconfig structure check
        env:
          # ASSUMPTION: adjust this to wherever the assignment's Kconfig
          # actually lives in the workspace repo layout.
          KCONFIG_PATH: app/Kconfig
        run: python3 .github/scripts/check_kconfig_l3.py